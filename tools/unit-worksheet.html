<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Worksheet - Tiếng Anh Global Success</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 14px;
      color: #222;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* ===== A4 PAGE ===== */
    .worksheet {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      padding: 12mm 18mm;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    /* Sections fill available space */
    .section-vocab { flex: 0 0 auto; display: flex; flex-direction: column; }
    .section-grammar { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; }
    .section-phonics { flex: 0 0 auto; display: flex; flex-direction: column; }

    /* ===== HEADER ===== */
    .unit-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2.5px solid #2c3e50;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ===== SECTION TITLES ===== */
    .section-title {
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 18px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .section-subtitle {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #333;
    }

    /* ===== VOCABULARY CARDS ===== */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 10px 0;
      flex: 1;
    }

    .vocab-card {
      border: 2px solid #888;
      border-radius: 8px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }

    .vocab-card .card-image {
      width: 100%;
      flex: 1;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      background: #fff;
    }

    .vocab-card .card-word {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 1px;
    }

    .vocab-card .card-phonetic {
      font-size: 12px;
      color: #666;
      font-style: italic;
      margin-bottom: 2px;
    }

    .vocab-card .card-meaning {
      font-size: 12px;
      color: #c0392b;
      font-style: italic;
    }

    /* ===== VOCAB TABLE (no images) ===== */
    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    .vocab-table th {
      background: #2c3e50;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      text-align: left;
    }

    .vocab-table td {
      padding: 5px 10px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    .vocab-table tr:nth-child(even) { background: #f8f9fa; }

    .vt-word { font-weight: 700; }
    .vt-phonetic { font-style: italic; color: #555; }
    .vt-meaning { color: #c0392b; font-style: italic; }

    /* ===== GRAMMAR ===== */
    .grammar-examples {
      margin: 8px 20px;
      list-style: none;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .grammar-examples li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      font-size: 15px;
      line-height: 1.8;
    }

    .grammar-examples .ex-en {
      flex: 1;
    }

    .grammar-examples .ex-vi {
      color: #555;
      font-style: italic;
      text-align: right;
      margin-left: 12px;
    }

    /* ===== PHONICS ===== */
    .phonics-desc {
      text-align: center;
      font-size: 14px;
      margin-bottom: 10px;
      font-style: italic;
    }

    /* Phonics rules (Grade 4+) */
    .phonics-rule {
      margin-bottom: 10px;
    }

    .phonics-rule-num {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .phonics-suffix {
      display: inline-block;
      background: #2c3e50;
      color: #fff;
      padding: 1px 10px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      margin-left: 4px;
    }

    .phonics-examples {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-left: 20px;
      margin-top: 2px;
    }

    .phonics-ex-item {
      font-size: 13px;
    }

    .phonics-ex-item strong {
      color: #2c3e50;
    }

    .phonics-ex-item i {
      color: #666;
    }

    .writing-title {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0 8px 0;
    }

    .writing-grid {
      width: 100%;
      border-collapse: collapse;
      margin: 0 auto;
      flex: 1;
    }

    .writing-grid td {
      border: 1.5px solid #888;
      width: 25%;
      height: auto;
    }

    .writing-grid .guide-word {
      text-align: center;
      font-size: 16px;
      color: #ccc;
      font-weight: 700;
      font-family: 'Roboto', sans-serif;
      padding: 5px 4px;
    }

    /* ===== SEPARATOR ===== */
    .section-sep {
      border: none;
      border-top: 1.5px solid #bbb;
      margin: 10px 0;
    }

    /* ===== LOADING STATE ===== */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: #999;
    }

    .error {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: #e74c3c;
    }

    /* ===== UNIT SELECTOR (screen only) ===== */
    .unit-selector {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 100;
      font-size: 14px;
    }

    .unit-selector label {
      font-weight: 700;
      margin-right: 8px;
    }

    .unit-selector select {
      padding: 4px 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .unit-selector button {
      margin-left: 8px;
      padding: 5px 14px;
      font-size: 13px;
      background: #2980b9;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .unit-selector button:hover {
      background: #1a6da0;
    }

    .btn-print {
      background: #27ae60 !important;
    }

    .btn-print:hover {
      background: #1e8e4e !important;
    }

    /* ===== PRINT STYLES ===== */
    @media print {
      @page {
        size: A4;
        margin: 12mm 18mm;
      }

      body {
        background: none;
        padding: 0;
      }

      .worksheet {
        width: 100%;
        height: auto;
        padding: 0;
        box-shadow: none;
      }

      .unit-selector {
        display: none !important;
      }

      .vocab-card {
        border-color: #555;
        background: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .vocab-table th {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .writing-grid td {
        border-color: #666;
      }

      /* Auto page breaks */
      .section-grammar { page-break-inside: avoid; }
      .section-phonics { page-break-inside: auto; }
      .writing-grid tr { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- Unit selector (screen only) -->
  <div class="unit-selector" id="unitSelector">
    <label for="gradeSelect">Lớp:</label>
    <select id="gradeSelect" onchange="onGradeChange()">
      <option value="1">Lớp 1</option>
      <option value="2">Lớp 2</option>
      <option value="3">Lớp 3</option>
      <option value="4">Lớp 4</option>
      <option value="5">Lớp 5</option>
    </select>
    <label for="unitSelect" style="margin-left:12px">Unit:</label>
    <select id="unitSelect"></select>
    <button onclick="loadSelectedUnit()">Tải</button>
    <button class="btn-print" onclick="window.print()">🖨️ In</button>
  </div>

  <!-- Worksheet container -->
  <div class="worksheet" id="worksheet">
    <div class="loading" id="loadingMsg">Đang tải dữ liệu...</div>
  </div>

  <script>
    // ===== CONFIG =====
    const DATA_BASE = 'worksheet-data/';

    // ===== INIT =====
    async function init() {
      // Get grade and unit from URL params
      const params = new URLSearchParams(window.location.search);
      const grade = params.get('grade') || '1';
      const unitNum = params.get('unit') || '5';

      document.getElementById('gradeSelect').value = grade;
      populateUnitSelector(parseInt(grade));
      document.getElementById('unitSelect').value = unitNum;
      await loadUnit(grade, unitNum);
    }

    // Populate the unit dropdown based on grade
    function populateUnitSelector(grade) {
      const select = document.getElementById('unitSelect');
      select.innerHTML = '';
      const maxUnit = grade <= 2 ? 16 : 20; // grades 3-5 may have up to 20 units
      for (let i = 1; i <= maxUnit; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Unit ${i}`;
        select.appendChild(option);
      }
    }

    // When grade changes, update unit list
    function onGradeChange() {
      const grade = parseInt(document.getElementById('gradeSelect').value);
      populateUnitSelector(grade);
    }

    // Load unit from selector
    function loadSelectedUnit() {
      const grade = document.getElementById('gradeSelect').value;
      const unitNum = document.getElementById('unitSelect').value;
      // Update URL without reload
      const url = new URL(window.location);
      url.searchParams.set('grade', grade);
      url.searchParams.set('unit', unitNum);
      window.history.pushState({}, '', url);
      loadUnit(grade, unitNum);
    }

    // Build the JSON filename based on grade
    function getJsonFilename(grade, unitNum) {
      if (grade === '1' || grade === 1) {
        return `unit${unitNum}.json`; // legacy: unit5.json
      }
      return `grade${grade}_unit${unitNum}.json`; // new: grade2_unit5.json
    }

    // ===== LOAD & RENDER =====
    async function loadUnit(grade, unitNum) {
      const worksheet = document.getElementById('worksheet');
      worksheet.innerHTML = '<div class="loading">Đang tải dữ liệu Lớp ' + grade + ' Unit ' + unitNum + '...</div>';

      const filename = getJsonFilename(grade, unitNum);
      try {
        const resp = await fetch(`${DATA_BASE}${filename}`);
        if (!resp.ok) throw new Error(`Chưa có dữ liệu cho Lớp ${grade} Unit ${unitNum}`);
        const data = await resp.json();
        renderWorksheet(data);
        document.title = `Lớp ${data.grade} - Unit ${data.unit}: ${data.title} - Worksheet`;
      } catch (err) {
        worksheet.innerHTML = `<div class="error">
          <p>⚠️ ${err.message}</p>
          <p style="margin-top:10px; font-size:13px; color:#999;">
            Hãy tạo file <code>${DATA_BASE}${filename}</code> với dữ liệu bài học.
          </p>
        </div>`;
      }
    }

    // ===== RENDER WORKSHEET =====
    function renderWorksheet(data) {
      const worksheet = document.getElementById('worksheet');
      const totalWords = data.vocabulary.words.length;

      let html = '';

      // ----- HEADER -----
      const gradeLabel = data.grade ? `Lớp ${data.grade} - ` : '';
      html += `<div class="unit-title">${gradeLabel}Unit ${data.unit}: ${data.title}</div>`;

      // ----- VOCABULARY -----
      const hasImages = data.vocabulary.words.some(w => w.image);
      html += `<div class="section-vocab">`;
      html += `<div class="section-title">VOCABULARY (TỪ VỰNG)</div>`;

      if (hasImages) {
        // Grade 1-2: cards with images
        html += `<div class="vocab-grid">`;
        data.vocabulary.words.forEach((w, i) => {
          const imgSrc = `${DATA_BASE}${w.image}`;
          html += `
            <div class="vocab-card">
              <img class="card-image" src="${imgSrc}" alt="${w.word}" onerror="this.style.display='none'">
              <div class="card-word">${w.word}</div>
              <div class="card-phonetic">${w.phonetic}</div>
              <div class="card-meaning">${w.meaning_vi}</div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        // Grade 3+: simple table without images
        html += `<table class="vocab-table">`;
        html += `<tr><th>Word</th><th>Pronunciation</th><th>Meaning</th></tr>`;
        data.vocabulary.words.forEach(w => {
          html += `<tr>
            <td class="vt-word">${w.word}</td>
            <td class="vt-phonetic">${w.phonetic}</td>
            <td class="vt-meaning">${w.meaning_vi}</td>
          </tr>`;
        });
        html += `</table>`;
      }
      html += `</div>`; // end section-vocab

      // ----- GRAMMAR -----
      html += `<hr class="section-sep">`;
      html += `<div class="section-grammar">`;
      html += `<div class="section-title">GRAMMAR (NGỮ PHÁP)</div>`;
      html += `<div class="section-subtitle">${data.grammar.title_vi}</div>`;

      html += `<ul class="grammar-examples">`;
      data.grammar.examples.forEach(ex => {
        html += `
          <li>
            <span class="ex-en">${ex.en}</span>
            <span class="ex-vi">(${ex.vi})</span>
          </li>
        `;
      });
      html += `</ul>`;
      html += `</div>`; // end section-grammar

      // ----- PHONICS or WRITING PRACTICE -----
      html += `<hr class="section-sep">`;
      html += `<div class="section-phonics">`;

      if (data.phonics && data.phonics.rules) {
        // Grade 3+: Phonics rules (e.g. pronunciation of s/es)
        html += `<div class="section-title">PHONICS (HỌC VỀ PHÁT ÂM)</div>`;
        data.phonics.rules.forEach((rule, idx) => {
          html += `<div class="phonics-rule">`;
          html += `<div class="phonics-rule-num">${idx + 1}. ${rule.label} <span class="phonics-suffix">${rule.suffix}</span></div>`;
          html += `<div class="phonics-examples">`;
          rule.examples.forEach(ex => {
            html += `<span class="phonics-ex-item"><strong>${ex.word}</strong> <i>${ex.phonetic}</i></span>`;
          });
          html += `</div></div>`;
        });
      } else if (data.phonics && data.phonics.letter) {
        // Grade 1-2: Single letter phonics + writing grid
        html += `<div class="section-title">PHONICS (NGỮ ÂM)</div>`;
        html += `<div class="phonics-desc">${data.phonics.description_vi}</div>`;

        // Writing practice grid
        html += `<div class="writing-title">Luyện viết</div>`;
        html += `<table class="writing-grid">`;
        const words = data.vocabulary.words;
        for (let r = 0; r < words.length; r++) {
          html += `<tr>`;
          html += `<td class="guide-word">${words[r].word}</td>`;
          html += `<td></td><td></td><td></td>`;
          html += `</tr>`;
        }
        html += `</table>`;
      } else {
        // No phonics: writing vocab practice
        html += `<div class="writing-title">Luyện viết từ vựng</div>`;
        html += `<table class="writing-grid">`;
        const words = data.vocabulary.words;
        for (let r = 0; r < words.length; r++) {
          html += `<tr>`;
          html += `<td class="guide-word">${words[r].word}</td>`;
          html += `<td></td><td></td><td></td>`;
          html += `</tr>`;
        }
        html += `</table>`;
      }

      html += `</div>`; // end section-phonics

      worksheet.innerHTML = html;
    }

    // ===== START =====
    init();
  </script>
</body>
</html>
