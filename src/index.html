<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cardlish Learn - Ứng dụng học flashcard phát âm tiếng Anh cho học sinh tiểu học">
  <meta name="theme-color" content="#fef9ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cardlish Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.2">
</head>
<body>
  <!-- Pointer indicator for desktop/TV -->
  <div class="pointer-indicator" id="pointerIndicator"></div>

  <!-- Progress bar (top, no header) -->
  <div class="progress-bar-container progress-bar-top" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progressBarContainer">
    <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <!-- Main card area -->
  <main class="main-content" id="mainContent">
    <!-- Card info (above the card, with speaker button) -->
    <div class="card-info" id="cardInfo" aria-live="polite">
      <span class="card-label" id="cardLabel">Thẻ 001</span>
      <span class="card-side" id="cardSide">· Mặt trước</span>
      <button class="audio-speaker-btn focusable" id="playAudio" data-action="play-audio" aria-label="Nghe âm thanh">
        🔊
      </button>
    </div>

    <!-- Study Layout (card centered, vocab and arrows on sides) -->
    <div class="study-layout">
      <!-- Prev Card Button -->
      <button class="nav-arrow-btn prev-arrow focusable" id="prevCard" data-action="prev-card" aria-label="Thẻ trước">
        ◀
      </button>

      <div class="vocab-side vocab-left" id="vocabLeft" aria-label="Từ vựng cột trái">
        <!-- Populated by JS -->
      </div>

      <div class="card-container-wrapper">
        <div class="card-container" id="cardContainer" role="region" aria-label="Thẻ học flashcard">
          <div class="card-flipper" id="cardFlipper">
            <div class="card-face card-front">
              <div class="card-image-shell">
                <img id="frontImage" src="" alt="Mặt trước thẻ" draggable="false">
              </div>
            </div>
            <div class="card-face card-back">
              <div class="card-image-shell">
                <img id="backImage" src="" alt="Mặt sau thẻ" draggable="false">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="vocab-side vocab-right" id="vocabRight" aria-label="Từ vựng cột phải">
        <!-- Populated by JS -->
      </div>

      <!-- Next Card Button -->
      <button class="nav-arrow-btn next-arrow focusable" id="nextCard" data-action="next-card" aria-label="Thẻ sau">
        ▶
      </button>
    </div>
  </main>

  <!-- Floating gallery button (top-right) -->
  <button class="gallery-fab focusable" id="galleryToggle" aria-label="Mở thư viện thẻ">
    📚
  </button>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay" role="alert" aria-busy="true">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>Đang tải thẻ học...</p>
  </div>

  <!-- Gallery overlay -->
  <div class="gallery-overlay" id="galleryOverlay" hidden>
    <div class="gallery-header">
      <button class="gallery-back-btn focusable" id="galleryBack" aria-label="Quay lại chế độ học">
        ← Quay lại
      </button>
      <h2 class="gallery-title">📚 Thư viện thẻ</h2>
    </div>

    <div class="gallery-controls">
      <div class="search-container">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Tìm thẻ (số, tên, âm...)" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="Xóa tìm kiếm" hidden>×</button>
      </div>

      <div class="color-filters" id="colorFilters" role="group" aria-label="Lọc theo màu">
        <!-- Populated by JS -->
      </div>

      <div class="card-count-selector" id="cardCountSelector">
        <span class="count-label">Số thẻ học:</span>
        <div class="count-buttons-wrapper">
          <div class="count-buttons">
            <button class="count-btn" data-count="10">10</button>
            <button class="count-btn" data-count="20">20</button>
            <button class="count-btn" data-count="50">50</button>
            <button class="count-btn active" data-count="all">Tất cả</button>
            <button class="count-btn" data-count="0" id="deselectAllBtn">Bỏ chọn</button>
          </div>
          <div class="custom-count-container">
            <input type="text" class="custom-count-input" id="customCountInput" placeholder="Tự nhập (vd: 1, 3, 5-8)" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <div class="gallery-summary" id="gallerySummary">
      <div class="gallery-summary-info">
        <span class="gallery-summary-text" id="filteredCount">Đã chọn 0 / 53 thẻ</span>
        <div class="selected-cards-list" id="selectedCardsList">Danh sách: (trống)</div>
      </div>
      <div class="gallery-summary-actions">
        <button class="export-btn focusable" id="exportVocabJson" aria-label="Xuất file JSON từ vựng">📥 Xuất file JSON</button>
        <button class="start-btn focusable" id="startStudying">🎓 Bắt đầu học</button>
      </div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Vocabulary Edit Overlay -->
  <div class="vocab-edit-overlay" id="vocabEditOverlay" hidden>
    <div class="vocab-edit-modal">
      <div class="vocab-edit-header">
        <h3 id="vocabEditTitle">✏️ Sửa từ vựng - Thẻ 001</h3>
        <button class="vocab-edit-close" id="vocabEditClose" aria-label="Đóng">&times;</button>
      </div>
      <div class="vocab-edit-body">
        <div class="vocab-edit-section">
          <h4>Mặt trước (Front)</h4>
          <div class="vocab-edit-list" id="frontVocabList">
            <!-- Dynamic rows -->
          </div>
          <button class="vocab-add-row-btn focusable" id="addFrontWord">+ Thêm từ mặt trước</button>
        </div>
        <div class="vocab-edit-section">
          <h4>Mặt sau (Back)</h4>
          <div class="vocab-edit-list" id="backVocabList">
            <!-- Dynamic rows -->
          </div>
          <button class="vocab-add-row-btn focusable" id="addBackWord">+ Thêm từ mặt sau</button>
        </div>
      </div>
      <div class="vocab-edit-footer">
        <button class="vocab-btn vocab-cancel-btn focusable" id="vocabEditCancel">Hủy</button>
        <button class="vocab-btn vocab-save-btn focusable" id="vocabEditSave">Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
